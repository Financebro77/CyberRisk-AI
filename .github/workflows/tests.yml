# =====================================================================
# CyberRisk AI — CI
#
# Runs on every push and pull request against `main` (and any PR).
#
#   1. Install dependencies   (Python matrix: 3.10 / 3.11 / 3.12 / 3.13)
#   2. Lint check             (ruff check — formatting + style rules)
#   3. Run the test suite     (pytest, incl. the tests/validate suite)
#   4. Security scan          (scripts/security_scan.py)
#   5. Docker build + run     (build the image, boot the container, verify
#                              /api/health and the served frontend)
#
# The quantitative engine and all tests run offline — no API key is needed.
# `ruff format --check` is intentionally NOT run: the codebase predates the
# formatter, and enforcing it would fail CI on existing files. The linter
# (ruff check) is the formatting gate.
# =====================================================================

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `test` extra is self-contained (pytest + ruff + the deps the API
          # tests and LLM/agent tests need); reporting/knowledge/web are the
          # package extras the suite also exercises.
          pip install -e ".[test,reporting,knowledge,web]"

      - name: Lint check (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: python -m pytest -q

      - name: Security scan
        run: python scripts/security_scan.py

  docker-build:
    name: Docker build + run
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the image
        run: |
          # Always log the tail of the build output when it fails so the
          # failing stage is visible in the job log without re-running.
          if ! docker build -t cyberrisk:ci . 2>&1 | tee /tmp/cyberrisk-build.log; then
            echo "::error::docker build failed — last 40 lines:"
            tail -40 /tmp/cyberrisk-build.log
            exit 1
          fi

      - name: Boot the container (no LLM key needed — engine is offline)
        run: |
          docker run -d --name cyberrisk-ci -p 8000:8000 \
            -e LLM_PROVIDER=deepseek \
            cyberrisk:ci
          # Wait for the API to come up (healthcheck also guards this).
          # If it never comes up, dump the container logs for debugging.
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::container never became reachable — docker logs:"
            docker logs cyberrisk-ci 2>&1 | tail -60
            docker inspect -f 'status={{.State.Status}} health={{.State.Health.Status}}' cyberrisk-ci || true
            exit 1
          fi

      - name: Verify API health
        run: |
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          echo "API /api/health -> OK"

      - name: Verify frontend is served
        run: |
          # The container serves the built SPA; without a built dist the API
          # still returns the "not built" JSON — so assert the UI shell loads.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          if [ "$code" != "200" ]; then
            echo "::error::frontend route / returned HTTP $code"
            curl -s http://127.0.0.1:8000/ | head -c 500
            exit 1
          fi
          echo "Frontend route / -> HTTP $code"

      - name: Verify API docs are served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)
          if [ "$code" != "200" ]; then
            echo "::error::API docs /docs returned HTTP $code"
            exit 1
          fi
          echo "API docs /docs -> HTTP $code"

      - name: Tear down
        run: docker rm -f cyberrisk-ci || true

  docker-validate:
    name: Docker validation (agent, engine, RAG, env)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the image
        run: |
          if ! docker build -t cyberrisk:latest . 2>&1 | tee /tmp/cyberrisk-build.log; then
            echo "::error::docker build failed — last 40 lines:"
            tail -40 /tmp/cyberrisk-build.log
            exit 1
          fi

      - name: Run the deployment validation suite
        run: |
          bash docker/validate/validate.sh --no-build
