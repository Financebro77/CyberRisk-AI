# =====================================================================
# CyberRisk AI — containerised deployment
#
#   docker compose up --build
#   → http://localhost:8000        (UI + API)
#   → http://localhost:8000/docs   (API docs)
#
# Configuration:
#   - Copy .env.example to .env and set your LLM provider + API key.
#   - .env is the SINGLE source of secrets (gitignored, never committed,
#     never baked into the image).  Compose injects it via env_file.
#   - All other settings use sensible defaults.
#
# What the service contains (single image, one process on :8000):
#   1. AI agent backend      — FastAPI /api/* routes + the consultant agent
#   2. Risk calculation engine — Monte Carlo simulation, scoring, metrics
#   3. RAG knowledge retrieval — SQLite vector store + offline HashEmbedder
#   4. Web application       — built React SPA served by the same process
#   5. Environment variables — injected from .env at runtime
# =====================================================================

services:
  cyberrisk:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyberrisk:latest
    container_name: cyberrisk
    ports:
      - "8000:8000"
    environment:
      # Explicitly forwarded so the app never needs the raw env_file name.
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
    env_file:
      - .env                       # OPENAI_API_KEY / DEEPSEEK_API_KEY + overrides
                                   # optional API security: CYBERRISK_API_KEY,
                                   # CYBERRISK_RATE_LIMIT (see docs/api.md §4)
    volumes:
      # Knowledge corpus + manifests (read-only) so ingested content persists
      # and updates on the host are visible without a rebuild.
      - ./knowledge/corpus:/app/knowledge/corpus:ro
      - ./knowledge/manifests:/app/knowledge/manifests:ro
      # Vector index (read-only): bake a populated index into the image for
      # a self-contained deploy, OR bind-mount a host-built index here to
      # refresh retrieval without a rebuild.  Do not point both at once.
      - ./knowledge/derived:/app/knowledge/derived:ro
      # Generated reports (write) — survive container restarts.
      - ./data/output:/app/data/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
