# =====================================================================
# CyberRisk AI — pre-commit security hooks (optional)
# =====================================================================
#
# Run `pip install pre-commit && pre-commit install` to enable.  These hooks
# protect the repository from accidental secrets, large files, and data
# uploads before anything reaches git history.
#
# Recommended standalone scanners (run in CI too):
#   - git-secrets    https://github.com/awslabs/git-secrets
#   - detect-secrets https://github.com/Yelp/detect-secrets
#   - trufflehog     https://github.com/trufflesecurity/trufflehog
#     e.g.  trufflehog git https://github.com/<owner>/cyberrisk.git
#
# ----------------------------------------------------------------------
# Config
# ----------------------------------------------------------------------

repos:
  # Secret scanning — blocks commits that contain high-confidence secrets.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # Large files — prevent accidentally committing data blobs / datasets.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: |
          (?x)^(
            web/frontend/package-lock\.json |
            web/frontend/pnpm-lock\.yaml
          )$

      # Catch accidental credential-like patterns (kept conservative).
      - id: detect-private-key
      - id: forbid-new-submodules

  # Repository hygiene — prevent accidental data-upload / PII patterns.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace

# ----------------------------------------------------------------------
# Pattern block-list — enforced by `git-secrets` if installed, and mirrored
# here as documentation.  Anything matching is a release blocker.
# ----------------------------------------------------------------------
secrets_patterns:
  - 'sk-[A-Za-z0-9]{16,}'            # OpenAI / DeepSeek style API keys
  - 'gh[pousr]_[A-Za-z0-9]{30,}'     # GitHub tokens
  - 'AKIA[0-9A-Z]{16}'               # AWS access key id
  - 'AIza[0-9A-Za-z_-]{30,}'         # Google API keys
  - 'xox[baprs]-[A-Za-z0-9-]{10,}'   # Slack tokens
  - 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'  # private key blocks
  - '[A-Za-z0-9+/]{32,}={0,2}'       # long base64 blobs (heuristic)

# ----------------------------------------------------------------------
# Never-commit paths — enforced by `.gitignore` and double-checked by the
# hooks above.  Do not commit:
#   .env / .env.*            secrets
#   *.key *.pem *.secret     private keys
#   data/raw data/private data/client_data/   confidential datasets
#   knowledge/corpus/imported/ knowledge/datasets/private/
#   reports/ data/output/    generated, rebuildable
#   *.log *.sqlite *.db      local state
# ----------------------------------------------------------------------
