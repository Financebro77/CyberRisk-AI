    category: "cybersecurity_framework"
    publication_frequency: "periodic_revision"
    industry_relevance: "all"
    reliability_rating: "high"
    licensing_status: "public_domain"
    permitted_usage: "Security control recommendations; risk management framework; AI explanation"
