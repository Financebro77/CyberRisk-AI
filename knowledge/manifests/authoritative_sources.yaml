# =====================================================================
# AUTHORITATIVE SOURCES — the approved registry for the knowledge corpus
# =====================================================================
# Every source that may enter the corpus is registered here.  This is the
# APPROVAL GATE: the populate workflow will not ingest a document whose source
# is not registered as approved.  Unapproved sources are skipped + logged.
#
# A source record:
#   source_name          display name
#   publisher            organisation that publishes it
#   url                  canonical URL
#   document_type        framework | guidance | report | dataset | database
#   category             one of: cybersecurity_framework, threat_intelligence,
#                        vulnerability_database, breach_statistics,
#                        cyber_insurance, regulatory_guidance, incident_database
#   publication_frequency  annual | periodic_revision | ongoing | irregular
#   industry_relevance   all | specific sectors
#   reliability_rating   high | medium | low   (quality assessment)
#   licensing_status     public_domain | open | proprietary
#   permitted_usage      what the corpus may do with it
#   suitable_for         which pipeline stages may consume it:
#                        rag_retrieval | model_calibration | risk_scoring_support
#
# Categories:
#   cybersecurity_framework | threat_intelligence | vulnerability_database |
#   breach_statistics | cyber_insurance | regulatory_guidance | incident_database
# =====================================================================

sources:

