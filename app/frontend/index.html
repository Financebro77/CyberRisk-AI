<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Armageddon" />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Armageddon" />
    <meta
      property="og:description"
      content="Armageddon — the last line of defence: commercial cyber risk assessment, Monte Carlo loss modelling and insurance structuring."
    />
    <meta
      name="description"
      content="Armageddon — the last line of defence: commercial cyber risk assessment, Monte Carlo loss modelling and insurance structuring."
    />
    <title>Armageddon — Cyber Risk AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the theme before first paint to avoid a light-mode flash.  The
      // app's default identity is ash-black (Armageddon); a stored light
      // preference is honoured.  Same key as src/lib/useTheme.ts.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('cyberrisk-theme'); } catch (e) {}
        var dark = stored !== 'light';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
