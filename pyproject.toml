[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberrisk"
version = "0.1.0"
description = "Commercial cyber risk assessment: scenario-based frequency-severity loss engine, Monte Carlo VaR/ES, insurance structuring."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
reporting = ["openpyxl>=3.0", "xlsxwriter>=3.0"]
agent = ["openai>=1.0", "python-dotenv>=1.0", "streamlit>=1.30"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
knowledge = ["pypdf>=4.0", "python-docx>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
